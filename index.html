const UpdateProgressModal = ({ challenge, user, onClose }) => {
    const myProgress = challenge.progress?.[user.uid] || 0;
    const [value, setValue] = useState(myProgress);
    const [loading, setLoading] = useState(false);

    const handleUpdate = async () => {
        const newVal = Number(value);
        if (!Number.isFinite(newVal) || newVal < 0) { notify("Entrez un nombre valide.", 'error'); return; }
        setLoading(true);
        const otherUid = challenge.createdBy===user.uid ? challenge.challengedUid : challenge.createdBy;
        const otherProgress = challenge.progress?.[otherUid] || 0;
        const updates = { [`progress.${user.uid}`]: newVal };
        if (newVal >= challenge.goal) { updates.status='completed'; updates.winner=user.uid; }
        else if (otherProgress >= challenge.goal) { updates.status='completed'; updates.winner=otherUid; }
        else { updates.status='active'; }
        // Journal des relevés : sans lui, un score peut être modifié sans
        // trace et l'adversaire n'a aucun moyen de suivre la progression.
        updates.history = window.firebase.firestore.FieldValue.arrayUnion({
            uid: user.uid, value: newVal, at: new Date().toISOString(),
        });
        try {
            await db.collection(APEX_APP_ID).doc(challenge.id).update(updates);
            notify(newVal >= challenge.goal ? "Objectif atteint, défi remporté !" : "Progression enregistrée.", newVal >= challenge.goal ? 'success' : 'info');
            onClose();
        } catch (e) {
            notify(errorMessage(e), 'error');
            setLoading(false);
        }
    };

    const journal = (challenge.history || []).slice().sort((a,b) => (a.at < b.at ? 1 : -1)).slice(0, 6);
    const otherUidForNames = challenge.createdBy===user.uid ? challenge.challengedUid : challenge.createdBy;
    const nameOf = (uid) => uid === user.uid
        ? 'Moi'
        : (challenge.createdBy === uid ? challenge.createdByName : challenge.challengedName) || 'Rival';

    const pct = Math.min(100, Math.round((value/challenge.goal)*100));

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-sheet" style={{padding:'24px',borderRadius:'34px'}} onClick={e=>e.stopPropagation()}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
                    <div>
                        <p style={{color:'#FF7A00',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase'}}>Mise à jour</p>
                        <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',marginTop:'2px'}}>{challenge.title}</h3>
                    </div>
                    <button onClick={onClose} style={{padding:'8px',background:'rgba(255,255,255,.12)',borderRadius:'18px',border:'1px solid rgba(255,255,255,.12)',color:'rgba(235,235,245,.58)',cursor:'pointer',display:'flex'}}><Icon name="x" size={16}/></button>
                </div>
                <div style={{textAlign:'center',marginBottom:'24px'}}>
                    <div style={{fontSize:'40px',marginBottom:'4px'}} className="emoji-native">{SPORT_ICONS[challenge.sport]}</div>
                    <div style={{display:'flex',alignItems:'baseline',justifyContent:'center',gap:'6px'}}>
                        <input type="number" min="0" max={challenge.goal*2}
                            style={{background:'transparent',border:'none',fontSize:'48px',fontFamily:'Syne,sans-serif',fontWeight:800,color:'#FF9F0A',textAlign:'center',width:'160px'}}
                            value={value} onChange={e=>setValue(e.target.value)}/>
                        <span style={{color:'rgba(235,235,245,.58)',fontSize:'14px',fontWeight:600}}>/{challenge.goal} {challenge.unit}</span>
                    </div>
                    <div className="progress-bar" style={{marginTop:'12px'}}>
                        <div className="progress-fill" style={{'--prog-w':pct+'%'}}/>
                    </div>
                    <p style={{color:'rgba(235,235,245,.58)',fontSize:'11px',marginTop:'6px'}}>{pct}% accompli</p>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginBottom:'20px'}}>
                    {[25,50,75,100].map(p => {
                        const v = Math.round((challenge.goal*p)/100);
                        return (
                            <button key={p} onClick={()=>setValue(v)} style={{padding:'10px 4px',borderRadius:'18px',border:'1px solid rgba(255,255,255,.12)',background:'rgba(255,255,255,.055)',cursor:'pointer',textAlign:'center'}}>
                                <p style={{color:'#FF9F0A',fontSize:'12px',fontWeight:800,fontFamily:'Syne,sans-serif'}}>{p}%</p>
                                <p style={{color:'rgba(235,235,245,.58)',fontSize:'9px',marginTop:'2px'}}>{v} {challenge.unit}</p>
                            </button>
                        );
                    })}
                </div>
                {journal.length > 0 && (
                    <div style={{marginBottom:'20px'}}>
                        <p className="friend-section-title" style={{marginBottom:'4px'}}>
                            <Icon name="clock" size={12}/>Derniers relevés
                        </p>
                        {journal.map((h, i) => (
                            <div key={i} className="history-row">
                                <span style={{color:'rgba(235,235,245,.78)',fontWeight:600}}>{nameOf(h.uid)}</span>
                                <span style={{color:'rgba(235,235,245,.4)',fontSize:'11px'}}>
                                    {new Date(h.at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
                                </span>
                                <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,color:h.uid===user.uid?'#FF9F0A':'rgba(235,235,245,.78)'}}>
                                    {h.value} {challenge.unit}
                                </span>
                            </div>
                        ))}
                    </div>
                )}
                <button disabled={loading} onClick={handleUpdate}
                    style={{width:'100%',padding:'14px',borderRadius:'20px',background:'linear-gradient(135deg,#FF7A00,#F2570A)',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
                    {loading ? <><div style={{width:'14px',height:'14px',border:'2px solid rgba(255,255,255,.3)',borderTopColor:'white',borderRadius:'50%',animation:'spin .7s linear infinite'}}/> Sauvegarde...</> : '✓ Enregistrer ma progression'}
                </button>
            </div>
        </div>
    );
};

const ChallengeCard = ({ challenge, user, onUpdate, onAccept, onDecline, onCancel, onRematch }) => {
    const isCreator = challenge.createdBy === user.uid;
    const otherName = isCreator ? challenge.challengedName : challenge.createdByName;
    const otherPhoto = isCreator ? challenge.challengedPhoto : challenge.createdByPhoto;
    const otherUid = isCreator ? challenge.challengedUid : challenge.createdBy;
    const myProg = challenge.progress?.[user.uid] || 0;
    const otherProg = challenge.progress?.[otherUid] || 0;
    const myPct = progressPct(myProg, challenge.goal);
    const otherPct = progressPct(otherProg, challenge.goal);
    const dl = daysLeft(challenge.deadline);
    const isWon = challenge.status==='completed' && challenge.winner===user.uid;
    const isLost = challenge.status==='completed' && challenge.winner===otherUid;
    const isPending = challenge.status==='pending';
    const isActive = challenge.status==='active';
    const [cancelling, setCancelling] = useState(false);
    const [rematching, setRematching] = useState(false);
    const lastEntry = (challenge.history || []).slice().sort((a,b) => (a.at < b.at ? 1 : -1))[0];

    const handleRematch = async () => {
        setRematching(true);
        try { await onRematch(challenge); } finally { setRematching(false); }
    };

    const handleCancel = async () => {
        setCancelling(true);
        try { await onCancel(challenge.id); } finally { setCancelling(false); }
    };

    return (
        <div className={`challenge-card ${isWon?'won':''} ${isLost?'lost':''} ${isCreator&&!isWon&&!isLost?'mine':''}`} style={{padding:'16px',marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'14px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    <div style={{width:'36px',height:'36px',borderRadius:'14px',background:'rgba(255,122,0,.15)',border:'1px solid rgba(255,122,0,.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}} className="emoji-native">
                        {SPORT_ICONS[challenge.sport]||'🎯'}
                    </div>
                    <div>
                        <h4 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'13px',color:'white',lineHeight:1.2}}>{challenge.title}</h4>
                        <p style={{fontSize:'10px',color:'rgba(235,235,245,.58)',marginTop:'2px'}}>{isCreator?'Vous avez défié':'Défié par'} <strong style={{color:'rgba(235,235,245,.78)'}}>{otherName}</strong></p>
                    </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'4px'}}>
                    {isWon && <span className="badge badge-green"><Icon name="trophy" size={9}/>Victoire</span>}
                    {isLost && <span className="badge badge-red">Défaite</span>}
                    {isPending&&!isCreator && <span className="badge badge-yellow">En attente</span>}
                    {isPending&&isCreator && <span className="badge badge-slate">Envoyé</span>}
                    {isActive && <span className="badge badge-orange"><Icon name="flame" size={9}/>En cours</span>}
                    {dl!==null&&isActive && <span style={{fontSize:'9px',color:dl<=2?'#FF453A':'rgba(235,235,245,.58)',fontWeight:700}}>J-{dl}</span>}
                </div>
            </div>
            <div style={{background:'rgba(255,255,255,.05)',borderRadius:'18px',padding:'10px 12px',marginBottom:'12px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{color:'rgba(235,235,245,.58)',fontSize:'10px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Objectif</span>
                <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'#FF9F0A'}}>{challenge.goal} <span style={{fontSize:'11px',color:'#FF7A00'}}>{challenge.unit}</span></span>
            </div>
            {(isActive||isWon||isLost) && (
                <div style={{marginBottom:'12px'}}>
                    {[{uid:user.uid,photo:user.photoURL,name:'Moi',prog:myProg,pct:myPct,color:'#FF9F0A',trackColor:'linear-gradient(90deg,#FF7A00,#FF9F0A)'},
                      {uid:otherUid,photo:otherPhoto,name:otherName,prog:otherProg,pct:otherPct,color:'rgba(235,235,245,.58)',trackColor:'linear-gradient(90deg,rgba(235,235,245,.4),rgba(235,235,245,.58))'}].map(p => (
                        <div key={p.uid} style={{marginBottom:'8px'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'5px'}}>
                                <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                                    <img src={p.photo||getAvatar(p.name)} style={{width:'20px',height:'20px',borderRadius:'10px',objectFit:'cover'}}/>
                                    <span style={{fontSize:'10px',fontWeight:700,color:'rgba(255,255,255,.94)'}}>{p.name}</span>
                                </div>
                                <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'12px',color:p.color}}>{p.prog}/{challenge.goal} {challenge.unit}</span>
                            </div>
                            <div className="progress-bar">
                                <div style={{height:'100%',borderRadius:'3px',background:p.trackColor,width:p.pct+'%',transition:'width 1s cubic-bezier(.16,1,.3,1)'}}/>
                            </div>
                        </div>
                    ))}
                </div>
            )}
            {isActive && lastEntry && (
                <p style={{fontSize:'11px',color:'rgba(235,235,245,.4)',marginBottom:'10px',display:'flex',alignItems:'center',gap:'6px'}}>
                    <Icon name="clock" size={11}/>
                    {(lastEntry.uid === user.uid ? 'Vous' : otherName)} — {lastEntry.value} {challenge.unit} le {new Date(lastEntry.at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
                </p>
            )}
            {isPending&&!isCreator && (
                <div style={{display:'flex',gap:'8px'}}>
                    <button onClick={()=>onDecline(challenge.id)} style={{flex:1,padding:'10px',borderRadius:'18px',background:'rgba(255,69,58,.08)',border:'1px solid rgba(255,69,58,.2)',color:'#FF453A',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',cursor:'pointer'}}>Refuser</button>
                    <button onClick={()=>onAccept(challenge.id)} style={{flex:2,padding:'10px',borderRadius:'18px',background:'linear-gradient(135deg,#FF7A00,#F2570A)',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',border:'none',cursor:'pointer'}}>⚡ Accepter</button>
                </div>
            )}
            {isPending&&isCreator && (
                <button className="cancel-btn" disabled={cancelling} onClick={handleCancel}>
                    {cancelling
                        ? <><div style={{width:'12px',height:'12px',border:'2px solid rgba(255,255,255,.3)',borderTopColor:'rgba(235,235,245,.78)',borderRadius:'50%',animation:'spin .7s linear infinite'}}/> Annulation...</>
                        : <><Icon name="xCircle" size={13}/>Annuler le défi</>
                    }
                </button>
            )}
            {isActive && (
                <button onClick={()=>onUpdate(challenge)}
                    style={{width:'100%',padding:'10px',borderRadius:'18px',background:'rgba(255,122,0,.1)',border:'1px solid rgba(255,122,0,.25)',color:'#FF9F0A',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}}>
                    <Icon name="edit" size={12}/>Mettre à jour ma progression
                </button>
            )}
            {(isWon||isLost) && (
                <div style={{textAlign:'center',padding:'8px',background:isWon?'rgba(48,209,88,.06)':'rgba(255,69,58,.06)',borderRadius:'18px',border:`1px solid ${isWon?'rgba(48,209,88,.2)':'rgba(255,69,58,.15)'}`}}>
                    <span style={{fontSize:'18px'}} className="emoji-native">{isWon?'🏆':'💪'}</span>
                    <p style={{fontSize:'11px',color:isWon?'#30D158':'#FF453A',fontWeight:700,marginTop:'2px'}}>{isWon?'Défi remporté !':'Défi perdu de peu.'}</p>
                    <button disabled={rematching} onClick={handleRematch}
                        style={{marginTop:'10px',padding:'9px 18px',borderRadius:'99px',background:'rgba(255,122,0,.16)',border:'1px solid rgba(255,122,0,.35)',color:'#FF9F0A',fontWeight:700,fontSize:'12px',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:'6px'}}>
                        {rematching
                            ? <><div style={{width:'12px',height:'12px',border:'2px solid rgba(255,122,0,.3)',borderTopColor:'#FF9F0A',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>Envoi…</>
                            : <><Icon name="refresh" size={12}/>Demander une revanche</>}
                    </button>
                </div>
            )}
        </div>
    );
};

const LeaderboardTab = ({ user, friends, friendProfiles, challenges }) => {
    const scores = useMemo(() => {
        const map = {};
        const allUids = [user.uid, ...friends.map(f=>f.uid)];
        allUids.forEach(uid => { map[uid] = {wins:0,total:0,pts:0}; });
        challenges.forEach(c => {
            if (c.status==='completed'&&c.winner) {
                allUids.forEach(uid => {
                    if (c.createdBy===uid||c.challengedUid===uid) {
                        map[uid]=map[uid]||{wins:0,total:0,pts:0};
                        map[uid].total++;
                        if (c.winner===uid){map[uid].wins++;map[uid].pts+=100;}
                        else map[uid].pts+=10;
                    }
                });
            }
        });
        return Object.entries(map).map(([uid,s]) => {
            const isMe=uid===user.uid;
            const p=isMe?{displayName:'Moi',photoURL:user.photoURL||getAvatar('Moi'),lastSeen:user.lastSeen}:(friendProfiles[uid]||{});
            return {uid,...s,displayName:p.displayName||'Joueur',photoURL:p.photoURL||getAvatar(p.displayName),lastSeen:p.lastSeen};
        }).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);
    },[challenges,friends,friendProfiles,user]);

    return (
        <div>
            <div style={{background:'rgba(255,122,0,.08)',border:'1px solid rgba(255,122,0,.2)',borderRadius:'26px',padding:'20px',marginBottom:'16px',textAlign:'center'}}>
                <div style={{fontSize:'36px',marginBottom:'8px'}} className="emoji-native">🏆</div>
                <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',letterSpacing:'.1em',textTransform:'uppercase'}}>Classement</h3>
                <p style={{color:'rgba(235,235,245,.58)',fontSize:'11px',marginTop:'4px'}}>Basé sur les défis complétés</p>
            </div>
            {scores.length===0 ? (
                <div style={{textAlign:'center',padding:'32px',color:'rgba(235,235,245,.58)'}}>Aucun défi complété encore.</div>
            ) : (
                <>
                {scores.length >= 2 && (
                    <div className="podium-wrap">
                        {scores.slice(0,3).map((s,i) => (
                            <div key={s.uid} className={`podium-step ${['gold','silver','bronze'][i]}`}>
                                <span className="emoji-native" style={{fontSize: i===0?'22px':'17px'}}>{['🥇','🥈','🥉'][i]}</span>
                                <img src={s.photoURL} className="podium-avatar"/>
                                <p style={{fontWeight:700,fontSize:'11px',color:s.uid===user.uid?'#FF9F0A':'white',textAlign:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%'}}>{s.displayName}</p>
                                <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'13px',color:'#FF9F0A'}}>{s.pts} pts</p>
                            </div>
                        ))}
                    </div>
                )}
                <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                    {scores.slice(scores.length>=2?3:0).map((s,i) => (
                        <div key={s.uid} className="fade-in" style={{background:'rgba(255,255,255,.06)',border:`1px solid ${s.uid===user.uid?'rgba(255,122,0,.3)':'rgba(255,255,255,.12)'}`,borderRadius:'22px',padding:'14px 16px',display:'flex',alignItems:'center',gap:'12px',animationDelay:`${i*0.05}s`}}>
                            <div style={{width:'28px',textAlign:'center',fontSize:'14px',fontFamily:'Syne,sans-serif',fontWeight:800,color:'rgba(235,235,245,.4)'}}>
                                #{(scores.length>=2?3:0)+i+1}
                            </div>
                            <div style={{position:'relative'}}>
                                <img src={s.photoURL} style={{width:'36px',height:'36px',borderRadius:'14px',objectFit:'cover'}}/>
                                <OnlineIndicator lastSeen={s.lastSeen} size={10}/>
                            </div>
                            <div style={{flex:1}}>
                                <p style={{fontWeight:700,fontSize:'13px',color:s.uid===user.uid?'#FF9F0A':'white'}}>{s.displayName}</p>
                                <p style={{fontSize:'10px',color:'rgba(235,235,245,.58)'}}>{s.wins} victoire{s.wins!==1?'s':''} · {s.total} défi{s.total!==1?'s':''}</p>
                            </div>
                            <div style={{textAlign:'right'}}>
                                <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'18px',color:'#FF9F0A'}}>{s.pts}</p>
                                <p style={{fontSize:'9px',color:'rgba(235,235,245,.58)',textTransform:'uppercase',letterSpacing:'.08em'}}>pts</p>
                            </div>
                        </div>
                    ))}
                </div>
                </>
            )}
        </div>
    );
};

const ProfileTab = ({ user, profile, setProfile, challenges, streak, personalRecords, activityDates, levelInfo, totalCalories, programsCompleted, varietyCount, soloCount, onShowRights, onShowPrivacy, onShowTerms, onManageConsent }) => {

            total: mine.length,

                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginBottom:'4px'}}>

                    )}

                <p style={{color:'rgba(235,235,245,.58)',fontSize:'11px'}}>{user.email}</p>
                <div style={{display:'inline-flex',alignItems:'center',gap:'4px',marginTop:'6px',padding:'4px 10px',background:'rgba(48,209,88,.08)',border:'1px solid rgba(48,209,88,.2)',borderRadius:'99px'}}>
                    <div style={{width:'6px',height:'6px',borderRadius:'50%',background:'#30D158'}} className="online-dot"/>
                    <span style={{fontSize:'9px',color:'#30D158',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em'}}>En ligne</span>

                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginTop:'12px',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'18px',padding:'8px 12px'}}>
                    <p style={{fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontSize:'10px',color:'rgba(235,235,245,.58)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,textAlign:'left'}}>{user.uid}</p>
                    <button onClick={copyId} style={{padding:'4px',background:'transparent',border:'none',cursor:'pointer',color:copied?'#30D158':'rgba(235,235,245,.58)',display:'flex',flexShrink:0}}>

                </div>
            </div>
            {/* ── Niveau / XP ─────────────────────────────────────────── */}
            {levelInfo && (
                <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,122,0,.2)',borderRadius:'24px',padding:'16px',marginBottom:'12px'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                            <span style={{fontSize:'20px'}} className="emoji-native">⭐</span>
                            <div>
                                <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'14px',color:'white'}}>Niveau {levelInfo.level} · {levelInfo.title}</p>
                                <p style={{fontSize:'9px',color:'rgba(235,235,245,.5)'}}>{levelInfo.xp} XP au total</p>
                            </div>
                        </div>
                        {!levelInfo.isMax && <span style={{fontSize:'9px',color:'#FF9F0A',fontWeight:700}}>{levelInfo.pct}%</span>}
                    </div>
                    <div className="progress-bar"><div className="progress-fill" style={{'--prog-w':`${levelInfo.pct}%`}}/></div>
                    {!levelInfo.isMax && <p style={{fontSize:'9px',color:'rgba(235,235,245,.5)',marginTop:'6px'}}>{levelInfo.ceil - levelInfo.xp} XP avant le niveau {levelInfo.level+1}</p>}
                </div>
            )}

            <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'8px',marginBottom:'16px'}}>
                {[
                    {label:'Total défis',value:myStats.total,icon:'target',color:'rgba(235,235,245,.78)'},
                    {label:'Victoires',value:myStats.wins,icon:'trophy',color:'#FF9F0A'},
                    {label:'Défaites',value:myStats.losses,icon:'zap',color:'#FF453A'},
                    {label:'En cours',value:myStats.active,icon:'flame',color:'#0A84FF'},
                ].map(s => (
                    <div key={s.label} className="stat-card">
                        <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
                            <Icon name={s.icon} size={14}/>
                            <p style={{color:'rgba(235,235,245,.58)',fontSize:'9px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>{s.label}</p>
                        </div>
                        <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'28px',color:s.color}}>{s.value}</p>
                    </div>
                ))}
            </div>

            {/* ── Calendrier d'activité + série ──────────────────────── */}
            <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'24px',padding:'16px',marginBottom:'12px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
                    <p style={{color:'#FF9F0A',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',display:'flex',alignItems:'center',gap:'6px'}}>
                        <Icon name="flame" size={12}/>Activité
                    </p>
                    {streak > 0 && (
                        <div className="streak-chip">
                            <span className="emoji-native" style={{fontSize:'11px'}}>🔥</span>
                            <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px'}}>{streak} jour{streak!==1?'s':''}</span>
                        </div>
                    )}
                </div>
                <ActivityHeatmap activityDates={activityDates}/>
            </div>

            {/* ── Statistiques d'entraînement avancées ──────────────────── */}
            <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'24px',padding:'16px',marginBottom:'12px'}}>
                <p style={{color:'#FF9F0A',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',marginBottom:'12px',display:'flex',alignItems:'center',gap:'6px'}}>
                    <Icon name="chartbar" size={12}/>Entraînement
                </p>
                <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'8px'}}>
                    {[
                        {label:'Kcal brûlées (est.)',value:totalCalories||0,icon:'flame',color:'#FF453A'},
                        {label:'Séances solo',value:soloCount||0,icon:'target',color:'rgba(235,235,245,.78)'},
                        {label:'Programmes suivis',value:programsCompleted||0,icon:'layers',color:'#FF9F0A'},
                        {label:'Sports pratiqués',value:varietyCount||0,icon:'star',color:'#0A84FF'},
                    ].map(s => (
                        <div key={s.label} className="record-tile">
                            <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px'}}>
                                <Icon name={s.icon} size={12}/>
                                <p style={{color:'rgba(235,235,245,.58)',fontSize:'8px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em'}}>{s.label}</p>
                            </div>
                            <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'20px',color:s.color}}>{s.value}</p>
                        </div>
                    ))}
                </div>
            </div>

            {/* ── Records personnels ─────────────────────────────────── */}
            {Object.keys(personalRecords).length > 0 && (
                <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'24px',padding:'16px',marginBottom:'12px'}}>
                    <p style={{color:'#FF9F0A',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',marginBottom:'12px',display:'flex',alignItems:'center',gap:'6px'}}>
                        <Icon name="star" size={12}/>Records personnels
                    </p>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'8px'}}>
                        {Object.entries(personalRecords).map(([sport,r]) => (
                            <div key={sport} className="record-tile">
                                <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px'}}>
                                    <span className="emoji-native" style={{fontSize:'15px'}}>{SPORT_ICONS[sport]||'🎯'}</span>
                                    <span style={{fontSize:'10px',color:'rgba(235,235,245,.58)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em'}}>{sport}</span>
                                </div>
                                <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'18px',color:'white'}}>{r.value} <span style={{fontSize:'11px',color:'#FF9F0A'}}>{r.unit}</span></p>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* ── Succès ──────────────────────────────────────────────── */}
            <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'24px',padding:'16px',marginBottom:'12px'}}>
                <p style={{color:'#FF9F0A',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',marginBottom:'12px',display:'flex',alignItems:'center',gap:'6px'}}>
                    <Icon name="medal" size={12}/>Succès · {(profile.unlockedBadges||[]).length}/{BADGES.length}
                </p>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px'}}>
                    {BADGES.map(b => {
                        const unlocked = (profile.unlockedBadges||[]).includes(b.id);
                        return (
                            <div key={b.id} className={`badge-tile ${unlocked?'':'locked'}`} title={b.desc}>
                                <span className="badge-emoji emoji-native">{b.emoji}</span>
                                <p style={{fontSize:'9px',fontWeight:700,color:'white',lineHeight:1.3}}>{b.label}</p>
                            </div>
                        );
                    })}
                </div>
            </div>

            <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'24px',padding:'16px',marginBottom:'12px'}}>
                <p style={{color:'#FF9F0A',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',marginBottom:'12px',display:'flex',alignItems:'center',gap:'6px'}}>
                    <Icon name="shield" size={12}/>Confidentialité & RGPD
                </p>
                <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                    {[
                        {label:'Mes droits RGPD', desc:'Accès, export, effacement, portabilité, opposition (art. 15-22)', onClick:onShowRights, icon:'download'},
                        {label:'Gérer mes préférences', desc:'Modifier ou retirer mon consentement à tout moment', onClick:onManageConsent, icon:'settings'},
                        {label:'Politique de confidentialité', desc:'Version 2.0 · Mai 2026 · Transferts Firebase/Google', onClick:onShowPrivacy, icon:'shield'},
                        {label:'Conditions générales', desc:'Version 2.0 · Mai 2026', onClick:onShowTerms, icon:'alertTriangle'},
                    ].map(item => (
                        <button key={item.label} onClick={item.onClick}
                            style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px',background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'18px',cursor:'pointer',textAlign:'left',width:'100%'}}>
                            <div style={{width:'28px',height:'28px',borderRadius:'12px',background:'rgba(255,122,0,.1)',border:'1px solid rgba(255,122,0,.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'#FF9F0A'}}>
                                <Icon name={item.icon} size={13}/>
                            </div>
                            <div style={{flex:1}}>
                                <p style={{fontSize:'11px',fontWeight:700,color:'white'}}>{item.label}</p>
                                <p style={{fontSize:'9px',color:'rgba(235,235,245,.58)',marginTop:'1px'}}>{item.desc}</p>
                            </div>
                            <Icon name="arrowRight" size={12} style={{color:'rgba(235,235,245,.4)',flexShrink:0}}/>
                        </button>
                    ))}
                </div>
            </div>
            {/* ── Contact DPO visible dans le profil (art. 13 §1 b RGPD) ── */}
            <div style={{background:'rgba(255,255,255,.045)',border:'1px solid rgba(255,255,255,.09)',borderRadius:'20px',padding:'12px',marginBottom:'12px',display:'flex',alignItems:'center',gap:'10px'}}>
                <div style={{width:'28px',height:'28px',borderRadius:'12px',background:'rgba(255,122,0,.08)',border:'1px solid rgba(255,122,0,.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'#FF9F0A'}}>
                    <Icon name="mail" size={13}/>
                </div>
                <div style={{flex:1}}>
                    <p style={{fontSize:'10px',fontWeight:700,color:'rgba(235,235,245,.78)'}}>Contact DPO / Données personnelles</p>
                    <a href={`mailto:${DPO_EMAIL}`} style={{fontSize:'10px',color:'#FF9F0A',textDecoration:'underline'}}>{DPO_EMAIL}</a>
                </div>
                <a href="https://www.cnil.fr" target="_blank" rel="noopener noreferrer"
                    style={{padding:'5px 10px',background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'12px',color:'rgba(235,235,245,.58)',fontSize:'9px',fontWeight:700,textDecoration:'none',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:'4px'}}>
                    CNIL <Icon name="externalLink" size={9}/>
                </a>
            </div>
            <button onClick={()=>auth.signOut()}
                style={{width:'100%',padding:'14px',borderRadius:'20px',background:'rgba(255,69,58,.08)',border:'1px solid rgba(255,69,58,.2)',color:'#FF453A',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginBottom:'32px'}}>
                <Icon name="logout" size={14}/>Déconnexion
            </button>
        </div>
    );
};

// ── APP PRINCIPALE ──────────────────────────────────────────────────────
function App() {
    const [consentState, setConsentState] = useState(() => loadConsent());
    const [showConsentBanner, setShowConsentBanner] = useState(false);
    const [showCustomizer, setShowCustomizer] = useState(false);
    const [showPrivacy, setShowPrivacy] = useState(false);
    const [showTerms, setShowTerms] = useState(false);
    const [showRights, setShowRights] = useState(false);
    const [showAgeGate, setShowAgeGate] = useState(false);
    const [ageConfirmed, setAgeConfirmed] = useState(() => {
        try { const c=loadConsent(); return c?.ageConfirmed===true; } catch { return false; }
    });
    const [firebaseReady, setFirebaseReady] = useState(false);
    const [user, setUser] = useState(null);
    const [profile, setProfile] = useState({displayName:'',photoURL:''});
    const [loading, setLoading] = useState(true);
    const [tab, setTab] = useState('home');
    const [challenges, setChallenges] = useState([]);
    const [friends, setFriends] = useState([]);
    const [friendProfiles, setFriendProfiles] = useState({});
    const [showCreate, setShowCreate] = useState(false);
    const [updateTarget, setUpdateTarget] = useState(null);
    const [filter, setFilter] = useState('all');
    const [friendRequestCount, setFriendRequestCount] = useState(0);
    const [badgeQueue, setBadgeQueue] = useState([]);
    const [homeView, setHomeView] = useState('challenges');
    const [soloSessions, setSoloSessions] = useState([]);
    const [showSoloModal, setShowSoloModal] = useState(false);
    const [showGoalModal, setShowGoalModal] = useState(false);
    const [showLibraryModal, setShowLibraryModal] = useState(false);
    const [showProgramsModal, setShowProgramsModal] = useState(false);
    const [activeProgram, setActiveProgram] = useState(null);
    const [chartSport, setChartSport] = useState(null);
    const presenceIntervalRef = useRef(null);
    const prevLevelRef = useRef(null);

    useEffect(() => {
        if (!ageConfirmed) { setShowAgeGate(true); setLoading(false); return; }
        if (!consentState) { setShowConsentBanner(true); setLoading(false); return; }
        loadFirebase().then(() => setFirebaseReady(true)).catch(() => setLoading(false));
    }, [ageConfirmed, consentState]);

    useEffect(() => {
        if (!firebaseReady) return;
        const unsub = auth.onAuthStateChanged(async (u) => {
            if (u) {
                setUser(u);
                const ref = db.collection('artifacts').doc(ONYX_APP_ID)
                    .collection('public').doc('data').collection('profiles').doc(u.uid);
                ref.onSnapshot(doc => {
                    if (doc.exists) setProfile(doc.data());
                    else {
                        const np = {uid:u.uid,displayName:u.email.split('@')[0],photoURL:getAvatar(u.email.split('@')[0]),createdAt:window.firebase.firestore.FieldValue.serverTimestamp()};
                        ref.set(np); setProfile(np);
                    }
                });
            } else {
                setUser(null);
                if (presenceIntervalRef.current) {
                    clearInterval(presenceIntervalRef.current);
                    presenceIntervalRef.current = null;
                }
            }
            setLoading(false);
        });
        return unsub;
    }, [firebaseReady]);

    useEffect(() => {
        if (!user || !firebaseReady) return;
        updatePresence(user.uid);
        presenceIntervalRef.current = setInterval(() => {
            updatePresence(user.uid);
        }, PRESENCE_INTERVAL_MS);
        const handleVisibility = () => {
            if (!document.hidden) updatePresence(user.uid);
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => {
            clearInterval(presenceIntervalRef.current);
            presenceIntervalRef.current = null;
            document.removeEventListener('visibilitychange', handleVisibility);
        };
    }, [user, firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection('artifacts').doc(ONYX_APP_ID).collection('users').doc(user.uid).collection('contacts').doc('list')
            .onSnapshot(doc => { if (doc.exists) setFriends(doc.data().friends||[]); else setFriends([]); });
        return unsub;
    },[user,firebaseReady]);

    useEffect(() => {
        if (!user||friends.length===0||!firebaseReady) return;
        const unsubs = friends.map(f =>
            db.collection('artifacts').doc(ONYX_APP_ID).collection('public').doc('data').collection('profiles').doc(f.uid)
                .onSnapshot(doc => { if (doc.exists) setFriendProfiles(p=>({...p,[f.uid]:doc.data()})); })
        );
        setLoading(false);
        return () => unsubs.forEach(u=>u());
    },[friends,user,firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection('apex_friend_requests')
            .where('to', '==', user.uid)
            .where('status', '==', 'pending')
            .onSnapshot(snap => setFriendRequestCount(snap.size));
        return unsub;
    },[user,firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection(APEX_APP_ID).where('createdBy','==',user.uid)
            .onSnapshot(snap => {
                const mine = snap.docs.map(d=>({id:d.id,...d.data()}));
                setChallenges(prev => {
                    const others=prev.filter(c=>c.createdBy!==user.uid);
                    return [...mine,...others].sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
                });
            });
        const unsub2 = db.collection(APEX_APP_ID).where('challengedUid','==',user.uid)
            .onSnapshot(snap => {
                const theirs = snap.docs.map(d=>({id:d.id,...d.data()}));
                setChallenges(prev => {
                    const mine=prev.filter(c=>c.challengedUid!==user.uid);
                    return [...mine,...theirs].sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
                });
            });
        setLoading(false);
        return ()=>{ unsub(); unsub2(); };
    },[user,firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection('artifacts').doc(ONYX_APP_ID)
            .collection('users').doc(user.uid).collection('workouts')
            .orderBy('createdAt','desc').limit(60)
            .onSnapshot(snap => setSoloSessions(snap.docs.map(d=>({id:d.id,...d.data()}))),
                        () => setSoloSessions([]));
        return unsub;
    },[user,firebaseReady]);

    const deleteSoloSession = async (id) => {
        try {
            await db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('users').doc(user.uid).collection('workouts').doc(id).delete();
            notify('Séance supprimée.', 'info');
        } catch (e) { notify(errorMessage(e), 'error'); }
    };

    const saveWeeklyGoal = async (target) => {
        try {
            await db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('public').doc('data').collection('profiles').doc(user.uid)
                .update({ weeklyGoal: target });
            setProfile(p => ({ ...p, weeklyGoal: target }));
        } catch (e) { notify(errorMessage(e), 'error'); }
    };

    // Jours où l'utilisateur a lui-même enregistré une progression —
    // base du calendrier d'activité et de la série de jours consécutifs.
    const myActivityDates = useMemo(() => {
        const set = new Set();
        if (!user) return set;
        challenges.forEach(c => (c.history||[]).forEach(h => {
            if (h.uid !== user.uid || !h.at) return;
            set.add(new Date(h.at).toISOString().slice(0,10));
        }));
        soloSessions.forEach(s => {
            if (!s.createdAt) return;
            const d = s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt);
            set.add(d.toISOString().slice(0,10));
        });
        return set;
    }, [challenges, soloSessions, user]);

    // Jours actifs sur la semaine glissante en cours (pour l'anneau d'objectif).
    const activeDaysThisWeek = useMemo(() => {
        let n = 0;
        for (let i = 0; i < 7; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            if (myActivityDates.has(d.toISOString().slice(0,10))) n++;
        }
        return n;
    }, [myActivityDates]);

    const streak = useMemo(() => {
        if (myActivityDates.size === 0) return 0;
        let count = 0;
        const cursor = new Date();
        if (!myActivityDates.has(cursor.toISOString().slice(0,10))) cursor.setDate(cursor.getDate()-1);
        while (myActivityDates.has(cursor.toISOString().slice(0,10))) {
            count++;
            cursor.setDate(cursor.getDate()-1);
        }
        return count;
    }, [myActivityDates]);

    // Meilleure performance atteinte par sport, tous défis confondus.
    const personalRecords = useMemo(() => {
        if (!user) return {};
        const map = {};
        challenges.forEach(c => {
            const mine = c.progress?.[user.uid] || 0;
            if (mine <= 0) return;
            if (!map[c.sport] || mine > map[c.sport].value) {
                map[c.sport] = { value: mine, unit: c.unit };
            }
        });
        soloSessions.forEach(s => {
            if (!s.value || s.value <= 0) return;
            if (!map[s.sport] || s.value > map[s.sport].value) {
                map[s.sport] = { value: s.value, unit: s.unit };
            }
        });
        return map;
    }, [challenges, soloSessions, user]);

    // Calories cumulées (estimation) : privilégie le champ stocké au moment
    // de l'enregistrement, calcule à la volée pour les anciennes séances.
    const totalCalories = useMemo(() => {
        return soloSessions.reduce((sum, s) => sum + (s.calories ?? estimateCalories(s.sport, s.value)), 0);
    }, [soloSessions]);

    // Nombre de programmes guidés distincts terminés (regroupés par
    // programRunId, un identifiant unique généré à chaque lancement).
    const programsCompleted = useMemo(() => {
        return new Set(soloSessions.filter(s => s.programRunId).map(s => s.programRunId)).size;
    }, [soloSessions]);

    // Sports différents pratiqués (défis + séances solo) — sert au badge
    // « touche-à-tout » et alimente la sélection du graphique de progression.
    const varietySports = useMemo(() => {
        const set = new Set();
        if (user) challenges.forEach(c => { if (c.createdBy===user.uid||c.challengedUid===user.uid) set.add(c.sport); });
        soloSessions.forEach(s => set.add(s.sport));
        return set;
    }, [challenges, soloSessions, user]);

    const badgeStats = useMemo(() => {
        if (!user) return null;
        const mine = challenges.filter(c=>c.createdBy===user.uid||c.challengedUid===user.uid);
        return {
            totalChallenges: mine.length,
            wins: mine.filter(c=>c.status==='completed'&&c.winner===user.uid).length,
            streak, friendCount: friends.length, soloCount: soloSessions.length,
            totalCalories, programsCompleted, varietyCount: varietySports.size,
            unlockedBadgesCount: (profile.unlockedBadges||[]).length,
        };
    }, [challenges, user, streak, friends, soloSessions, totalCalories, programsCompleted, varietySports, profile.unlockedBadges]);

    // XP dérivée + niveau courant. Purement calculé, aucune écriture DB.
    const levelInfo = useMemo(() => {
        if (!badgeStats) return getLevelInfo(0);
        return getLevelInfo(computeXp(badgeStats));
    }, [badgeStats]);

    // Fête chaque montée de niveau avec la même overlay que les succès.
    useEffect(() => {
        if (!levelInfo) return;
        if (prevLevelRef.current === null) { prevLevelRef.current = levelInfo.level; return; }
        if (levelInfo.level > prevLevelRef.current) {
            setBadgeQueue(q => [...q, { id:`level_${levelInfo.level}`, emoji:'⭐', label:`Niveau ${levelInfo.level}`, desc:`Vous êtes maintenant « ${levelInfo.title} »`}]);
        }
        prevLevelRef.current = levelInfo.level;
    }, [levelInfo]);

    const badgeStatsWithLevel = useMemo(() => {
        if (!badgeStats) return null;
        return { ...badgeStats, level: levelInfo.level };
    }, [badgeStats, levelInfo]);

    // Détecte les succès nouvellement atteints, les enregistre sur le
    // profil (pour ne pas re-célébrer à chaque rechargement) et les met
    // en file pour l'overlay de célébration.
    useEffect(() => {
        if (!user || !badgeStatsWithLevel || !profile) return;
        const already = new Set(profile.unlockedBadges || []);
        const newly = BADGES.filter(b => !already.has(b.id) && b.check(badgeStatsWithLevel));
        if (newly.length === 0) return;
        const ref = db.collection('artifacts').doc(ONYX_APP_ID)
            .collection('public').doc('data').collection('profiles').doc(user.uid);
        ref.update({ unlockedBadges: window.firebase.firestore.FieldValue.arrayUnion(...newly.map(b=>b.id)) }).catch(()=>{});
        setBadgeQueue(q => [...q, ...newly]);
    }, [badgeStatsWithLevel, profile, user]);

    // Sans cette veille, personne n'est prévenu qu'un défi a été accepté,
    // refusé ou remporté tant qu'il ne rouvre pas l'onglet.
    const seenChallengesRef = useRef(null);
    useEffect(() => {
        if (!user) { seenChallengesRef.current = null; return; }
        const seen = seenChallengesRef.current;
        if (seen) {
            challenges.forEach(c => {
                const before = seen[c.id];
                if (!before) {
                    if (c.status === 'pending' && c.createdBy !== user.uid) {
                        notify(`${c.createdByName || 'Un athlète'} vous défie : ${c.title}`, 'info');
                    }
                    return;
                }
                if (before.status === c.status) return;
                if (c.status === 'active' && c.createdBy === user.uid) notify(`Défi accepté : ${c.title}`, 'success');
                if (c.status === 'declined' && c.createdBy === user.uid) notify(`Défi refusé : ${c.title}`, 'error');
                if (c.status === 'completed') {
                    notify(c.winner === user.uid ? `Victoire sur « ${c.title} » !` : `« ${c.title} » remporté par votre rival.`,
                           c.winner === user.uid ? 'success' : 'info');
                }
            });
        }
        seenChallengesRef.current = Object.fromEntries(challenges.map(c => [c.id, { status: c.status, winner: c.winner }]));
    }, [challenges, user]);

    const handleAgeConfirm = () => { setAgeConfirmed(true); setShowAgeGate(false); setShowConsentBanner(true); };
    const handleAgeDeny = () => { setShowAgeGate(false); setLoading(false); };
    const handleAcceptAll = () => { const c = saveConsent({functional:true,analytics:true,ageConfirmed:true}); setConsentState(c); setShowConsentBanner(false); };
    const handleRefuseAll = () => { const c = saveConsent({functional:false,analytics:false,ageConfirmed:true}); setConsentState(c); setShowConsentBanner(false); };
    const handleCustomSave = (prefs) => { const c = saveConsent({...prefs,ageConfirmed:true}); setConsentState(c); setShowConsentBanner(false); setShowCustomizer(false); };
    const handleManageConsent = () => setShowConsentBanner(true);

    const acceptChallenge = async (id) => {
        try { await db.collection(APEX_APP_ID).doc(id).update({status:'active',accepted:true}); notify("Défi accepté. À vous de jouer.", 'success'); }
        catch (e) { notify(errorMessage(e), 'error'); }
    };
    const declineChallenge = async (id) => {
        try { await db.collection(APEX_APP_ID).doc(id).update({status:'declined'}); notify("Défi refusé.", 'info'); }
        catch (e) { notify(errorMessage(e), 'error'); }
    };
    const cancelChallenge = async (id) => {
        try { await db.collection(APEX_APP_ID).doc(id).update({status:'cancelled'}); notify("Défi annulé.", 'info'); }
        catch (e) { notify(errorMessage(e), 'error'); }
    };

    // Revanche : rejoue le même objectif dans l'autre sens, sans repasser
    // par le formulaire de création.
    const rematchChallenge = async (c) => {
        const isCreator = c.createdBy === user.uid;
        const oppUid   = isCreator ? c.challengedUid : c.createdBy;
        const oppName  = (isCreator ? c.challengedName : c.createdByName) || 'Rival';
        const oppPhoto = (isCreator ? c.challengedPhoto : c.createdByPhoto) || getAvatar(oppName);
        try {
            await db.collection(APEX_APP_ID).add({
                title: c.title && c.title.startsWith('Revanche') ? c.title : `Revanche — ${c.title || c.sport}`,
                sport: c.sport, unit: c.unit, goal: c.goal, description: c.description || '',
                deadline: null, isPublic: false,
                createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: user.uid,
                createdByName: profile.displayName,
                createdByPhoto: profile.photoURL || getAvatar(profile.displayName),
                challengedUid: oppUid, challengedName: oppName, challengedPhoto: oppPhoto,
                status: 'pending', progress: { [user.uid]: 0, [oppUid]: 0 }, accepted: false, history: [],
            });
            notify(`Revanche envoyée à ${oppName}.`, 'success');
        } catch (e) { notify(errorMessage(e), 'error'); }
    };

    const filteredChallenges = useMemo(() => {
        if (filter==='all') return challenges.filter(c=>c.status!=='declined'&&c.status!=='cancelled');
        return challenges.filter(c=>c.status===filter);
    },[challenges,filter]);

    const pendingCount = challenges.filter(c=>c.status==='pending'&&c.challengedUid===user?.uid).length;
    const activeCount = challenges.filter(c=>c.status==='active').length;

    if (showPrivacy) return <PrivacyPage onClose={()=>setShowPrivacy(false)}/>;
    if (showTerms) return <TermsPage onClose={()=>setShowTerms(false)}/>;
    if (showAgeGate) return <AgeGate onConfirm={handleAgeConfirm} onDeny={handleAgeDeny}/>;

    if (!ageConfirmed && !showAgeGate) return (

                <p style={{color:'rgba(235,235,245,.58)',fontSize:'12px',lineHeight:1.7,maxWidth:'280px'}}>ONYX RivalZ est réservé aux personnes âgées de 16 ans ou plus (art. 8 RGPD).</p>
                <button onClick={()=>setShowAgeGate(true)} style={{marginTop:'20px',padding:'12px 24px',background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'18px',color:'rgba(235,235,245,.78)',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',cursor:'pointer'}}>
                    J'ai en réalité 16 ans ou plus
                </button>
            </div>
        </div>

    if (loading && consentState && !firebaseReady) return (
        <div style={{height:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'#05060A',flexDirection:'column',gap:'16px'}}>

            {showCustomizer && (

                                                    </svg>
                                                    <div style={{flex:1}}>
                                                        <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'14px',color:'white'}}>Objectif de la semaine</p>
                                                        <p style={{fontSize:'11px',color:'rgba(235,235,245,.58)',marginTop:'2px'}}>{activeDaysThisWeek} / {goal} jour{goal!==1?'s':''} actif{goal!==1?'s':''}</p>
                                                    </div>
                                                    <Icon name="settings" size={15} style={{color:'rgba(235,235,245,.4)',flexShrink:0}}/>
                                                </div>
                                            );
                                        })()}

                                        <div className="segmented">
                                            <button className={`segmented-item ${homeView==='challenges'?'active':''}`} onClick={()=>setHomeView('challenges')}>
                                                <Icon name="target" size={13}/>Défis
                                            </button>
                                            <button className={`segmented-item ${homeView==='solo'?'active':''}`} onClick={()=>setHomeView('solo')}>
                                                <Icon name="flame" size={13}/>Entraînements
                                            </button>
                                        </div>

                                        {homeView==='challenges' && (
                                        <>
                                        <div style={{display:'flex',gap:'6px',marginBottom:'16px',overflowX:'auto',paddingBottom:'4px'}}>
                                            {[{id:'all',label:'Tous'},{id:'pending',label:'En attente',count:challenges.filter(c=>c.status==='pending').length},{id:'active',label:'En cours'},{id:'completed',label:'Terminés'}].map(f => (
                                                <button key={f.id} onClick={()=>setFilter(f.id)}
                                                    style={{flexShrink:0,display:'flex',alignItems:'center',gap:'5px',padding:'7px 14px',borderRadius:'99px',border:`1px solid ${filter===f.id?'rgba(255,122,0,.5)':'rgba(255,255,255,.12)'}`,background:filter===f.id?'rgba(255,122,0,.1)':'rgba(255,255,255,.055)',cursor:'pointer',whiteSpace:'nowrap'}}>

                                                    {f.count>0&&<span style={{width:'16px',height:'16px',borderRadius:'50%',background:'#FF7A00',fontSize:'9px',fontWeight:800,color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>{f.count}</span>}
                                                </button>
                                            ))}
                                        </div>
                                        {filteredChallenges.length===0 ? (
                                            <div style={{textAlign:'center',padding:'48px 16px'}}>
                                                <div style={{fontSize:'48px',marginBottom:'12px'}} className="emoji-native">⚡</div>
                                                <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',marginBottom:'8px'}}>Aucun défi ici</h3>
                                                <p style={{color:'rgba(235,235,245,.58)',fontSize:'12px',marginBottom:'20px'}}>Lancez votre premier défi à un ami !</p>
                                                <button onClick={()=>setShowCreate(true)}
                                                    style={{padding:'12px 24px',background:'linear-gradient(135deg,#FF7A00,#F2570A)',borderRadius:'20px',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',border:'none',cursor:'pointer'}}>
                                                    + Créer un défi
                                                </button>
                                            </div>
                                        ) : (
                                            filteredChallenges.map(c => (
                                                <ChallengeCard key={c.id} challenge={c}
                                                    user={{uid:user.uid,photoURL:profile.photoURL,displayName:profile.displayName}}
                                                    onUpdate={setUpdateTarget} onAccept={acceptChallenge} onDecline={declineChallenge}
                                                    onCancel={cancelChallenge} onRematch={rematchChallenge}/>
                                            ))
                                        )}
                                        </>
                                        )}

                                        {homeView==='solo' && (
                                        <>
                                        {/* ── Niveau / XP ─────────────────────────────────────── */}
                                        <div style={{background:'var(--glass)',border:'1px solid var(--glass-line)',borderRadius:'20px',padding:'14px 16px',marginBottom:'12px'}}>
                                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
                                                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                                    <span style={{fontSize:'18px'}} className="emoji-native">⭐</span>
                                                    <div>
                                                        <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'13px',color:'white'}}>Niveau {levelInfo.level} · {levelInfo.title}</p>
                                                        <p style={{fontSize:'9px',color:'rgba(235,235,245,.5)'}}>{levelInfo.xp} XP{!levelInfo.isMax ? ` · ${levelInfo.ceil - levelInfo.xp} XP avant le niveau suivant` : ' · Niveau maximum'}</p>
                                                    </div>
                                                </div>
                                                <span style={{fontSize:'8px',fontWeight:700,color:'#FF9F0A',background:'rgba(255,122,0,.12)',borderRadius:'99px',padding:'4px 9px'}}>🔥 {totalCalories} kcal</span>

                                                <Icon name="plus" size={15}/>Séance
                                            </button>
                                            <button onClick={()=>setShowProgramsModal(true)}
                                                style={{padding:'12px 6px',borderRadius:'18px',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.14)',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'9px',letterSpacing:'.06em',textTransform:'uppercase',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'5px'}}>

                                            </button>
                                            <button onClick={()=>setShowLibraryModal(true)}

                                            <Icon name={n.icon} size={20} className={tab===n.id?'text-orange-500':'text-slate-500'}/>
                                            {n.id==='friends' && friendRequestCount > 0 && (
                                                <span style={{position:'absolute',top:'-6px',right:'-8px',width:'14px',height:'14px',background:'#FFD60A',borderRadius:'50%',fontSize:'8px',fontWeight:800,color:'#000',display:'flex',alignItems:'center',justifyContent:'center',border:'2px solid #05060A'}}>
                                                    {friendRequestCount > 9 ? '9+' : friendRequestCount}
                                                </span>
                                            )}
                                        </div>
                                        <span style={{fontSize:'9px',fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:tab===n.id?'#FF9F0A':'rgba(235,235,245,.4)'}}>{n.label}</span>
                                    </button>
                                ))}
                            </nav>

                            {showCreate && <CreateChallengeModal user={user} profile={profile} friends={friends} friendProfiles={friendProfiles} onClose={()=>setShowCreate(false)}/>}
                            {updateTarget && <UpdateProgressModal challenge={updateTarget} user={user} onClose={()=>setUpdateTarget(null)}/>}
                            {showSoloModal && <SoloSessionModal user={user} onClose={()=>setShowSoloModal(false)}/>}
                            {showGoalModal && <WeeklyGoalModal current={profile.weeklyGoal||4} onClose={()=>setShowGoalModal(false)} onSave={saveWeeklyGoal}/>}
                            {showLibraryModal && <ExerciseLibraryModal onClose={()=>setShowLibraryModal(false)}/>}
                            {showProgramsModal && <ProgramsModal onClose={()=>setShowProgramsModal(false)} onSelect={(p)=>{setActiveProgram(p); setShowProgramsModal(false);}}/>}
                            {activeProgram && (
                                <ProgramRunner program={activeProgram} user={user}
                                    onClose={()=>setActiveProgram(null)}
                                    onFinished={()=>notify(`Programme « ${activeProgram.label} » terminé !`, 'success')}/>
                            )}
                        </>
                    )}
                </div>
            )}
            <ToastHost/>
            {badgeQueue.length > 0 && (
                <BadgeUnlockOverlay badge={badgeQueue[0]} onClose={() => setBadgeQueue(q => q.slice(1))}/>
            )}
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
